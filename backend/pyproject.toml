[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecity-backend"
version = "0.1.0"
description = "FastAPI service for CodeCity: analysis jobs, city data, explanations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Database
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Job queue / cache
    "redis>=5.0",
    "arq>=0.26",
    # Mining, parsing, graph building and CPU inference all come from the
    # ml package. Its [gnn] extra supplies torch + torch-geometric. Install
    # torch from the CPU wheel index first (see Phase 4, File 43).
    "codecity-ml[gnn]",
    # Security / utils
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "codecity_ml"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true