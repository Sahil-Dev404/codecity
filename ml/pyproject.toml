[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codecity-ml"
version = "0.1.0"
description = "Mining, graph building and GNN-based defect prediction for CodeCity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Config and CLI
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    # Git mining
    "pydriller>=2.6",
    "gitpython>=3.1",
    # Parsing
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "lizard>=1.17",
    # Data and classic ML (baselines)
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "networkx>=3.2",
]

[project.optional-dependencies]
# Heavy extras are opt-in so a basic install stays fast:
#   pip install -e "ml[gnn]"
gnn = ["torch>=2.2", "torch-geometric>=2.5"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]
tracking = ["wandb>=0.17", "mlflow>=2.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
codecity = "codecity_ml.cli:app"

# ── Packaging ────────────────────────────────────────────────
# ml/ also holds configs/, artifacts/ and tests/, so we tell setuptools
# exactly which package to ship instead of letting it guess.
[tool.setuptools.packages.find]
include = ["codecity_ml*"]

# ── Ruff (linter) ────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["codecity_ml"]

# ── Black (formatter) ────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py310"]

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true